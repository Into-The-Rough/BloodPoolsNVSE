[Main]
bEnabled=1
; pool width = body span (pelvis to the farthest limb root, doubled, about 100 for a human) x fPoolScale, clamped to fPoolMin..fPoolMax (game units)
fPoolScale=1.2
fPoolMin=60
fPoolMax=300
; span assumed when the skeleton gives none
fDefaultSpan=100
; seconds a pool stays before fading
fLifetime=600
; the body is settled when every wounded part, and any part shot off, moves slower than fSettleSpeed units/s for fSettleSeconds
fSettleSpeed=2
fSettleSeconds=0.3
; never earlier than fMinWait after death, always by fMaxWait
fMinWait=0.5
fMaxWait=4
; corpses further than this from the player get no pool
fMaxDistance=6000
; every wound bleeds: the killing one at full size, earlier ones at fWoundScale scaled by their share of the damage
fWoundScale=0.5
; a part shot off bleeds fStumpScale more at the stump, and the piece leaves a pool of fSeveredScale
fStumpScale=1.2
fSeveredScale=0.35
; most pools one body leaves, wounds close together share one
iMaxBodyPools=4
; explosive kills get a large splatter at the body instead of a pool
bExplosions=1
fExplosionScale=1.5
; seconds after an explosion kill before its splatter, so the blast decals go first
fExplosionDelay=0.5
; splatter decal tint, the vanilla DecalBloodPlaceable1 colour
fRed=0.706
fGreen=0.094
fBlue=0.027

[Pools]
; spreading mesh pools under bodies, 0 falls back to a flat decal
bPools=1
; height from the drawn surface (1) or from collision (0), drawn avoids sinking into road pieces
bVisualProbe=1
; seconds a pool takes to spread, seconds it fades at the end of fLifetime, units it floats above the ground
fDuration=6
fFade=5
fLift=3
; a step taller than fMaxStep units or a slope steeper than these degrees stops the spread there
fMaxStep=6
fSlopeUp=20
fSlopeDown=35
; edge lobes (0 round, 1 deep), how much faster the quickest lobe runs than the slowest
fLobes=0.3
fRateJitter=0.6
; share of the radius that seeps out slowly after the spread, and seconds it takes
fCreep=0.2
fCreepSeconds=40
; per pool randomness as fractions: size, spread time, darkness, and how far blood shifts from crimson to deep red
fSizeJitter=0.2
fDurationJitter=0.35
fTintJitter=0.15
fHueJitter=0.2
; ground heights one pool measures a frame while spreading, the most collision casts and scene picks all pools and new placements make together (at least 13, a body's first pool), and live pools (1 to 16) before the oldest is removed
iRaysPerTick=6
iRaysPerFrame=32
iMaxPools=16
